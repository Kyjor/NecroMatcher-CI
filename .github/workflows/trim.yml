name: Trim

on:
  workflow_dispatch:

jobs:
  build:
    name: Trim
    uses: ./.github/workflows/build.yml
    with:
      demo: false
      trim: true
      gmtk_ref: battler-trim
      julgame_rev: trim-support
    secrets: inherit

  build-demo:
    name: Trim demo
    uses: ./.github/workflows/build.yml
    with:
      demo: true
      trim: true
      gmtk_ref: battler-trim
      julgame_rev: trim-support
    secrets: inherit
