name: Steam Deploy

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Trim run whose steam-manifest-* artifacts should be set live'
        required: true
        type: string
      targets:
        description: 'Unused. Full and demo are both published.'
        required: true
        type: choice
        options:
          - both
          - linux
          - windows
        default: both

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download full manifests
        uses: actions/download-artifact@v4
        with:
          pattern: steam-manifest-full-*
          path: manifests-full
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download demo manifests
        uses: actions/download-artifact@v4
        with:
          pattern: steam-manifest-demo-*
          path: manifests-demo
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish full and demo
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_BRANCH: trimmed
        run: |
          set -euo pipefail
          STEAM_APP_ID=1410040 STEAM_BUILD_DESC=trimmed STEAM_MANIFESTS_DIR=manifests-full \
            bash scripts/steam_pipe.sh publish
          STEAM_APP_ID=4623610 STEAM_BUILD_DESC="trimmed demo" STEAM_MANIFESTS_DIR=manifests-demo \
            bash scripts/steam_pipe.sh publish
