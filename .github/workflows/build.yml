name: Build NecroMatcher

on:
  workflow_call:
    inputs:
      demo:
        description: Build the demo variant (NECRO_DEMO baked into the app)
        type: boolean
        default: false
      trim:
        description: juliac --trim=safe against the trim branches
        type: boolean
        default: false
      gmtk_ref:
        description: gmtk-2024 branch to build
        type: string
        default: speed-up-sysimage
      julgame_rev:
        description: JulGame.jl branch to build
        type: string
        default: develop

jobs:
  test:
    name: ${{ inputs.demo && 'Demo' || 'Full' }} - Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      ARTIFACT_PREFIX: ${{ inputs.demo && 'NecroMatcher-Demo' || 'NecroMatcher' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.13'
            os: ubuntu-latest
            arch: x64
          - version: '1.13'
            os: macos-latest
            arch: aarch64
          - version: '1.13'
            os: windows-latest
            arch: x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          ssh-key: ${{ secrets.PRIVATE_SSH_KEY }}
          repository: Kyjor/gmtk-2024
          ref: ${{ inputs.gmtk_ref }}
          fetch-depth: 0
      - name: Mark JulGame as a trim build
        if: inputs.trim
        working-directory: ./Battler
        run: printf '[JulGame]\ntrim = true\n' > LocalPreferences.toml
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Battler/package-lock.json
      - name: Install Node Dependencies
        working-directory: ./Battler
        run: npm ci
      - name: Setup Ubuntu Display (if applicable)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa ffmpeg
          # GHA has no GPU; GLX + mesa llvmpipe lets SDL_RENDERER_ACCELERATED succeed.
          Xvfb :99 -screen 0 1280x720x24 +extension GLX &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "SDL_VIDEODRIVER=x11" >> "$GITHUB_ENV"
          echo "SDL_AUDIODRIVER=dummy" >> "$GITHUB_ENV"
      - name: Install PulseAudio on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --check || pulseaudio --start
          pactl load-module module-null-sink sink_name=vspeaker sink_properties=device.description=virtual_speaker
          pactl load-module module-remap-source master=vspeaker.monitor source_name=vmic source_properties=device.description=virtual_mic
      - name: Install BlackHole and ffmpeg on macOS
        if: matrix.os == 'macOS-latest'
        run: |
          brew install blackhole-2ch ffmpeg openssl@3
      - name: Install Scream on Windows
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Invoke-WebRequest https://github.com/duncanthrax/scream/releases/download/4.0/Scream4.0.zip -OutFile Scream4.0.zip
          Expand-Archive -Path Scream4.0.zip -DestinationPath Scream
          openssl req -batch -verbose -x509 -newkey rsa -keyout ScreamCertificate.pvk -out ScreamCertificate.cer -nodes -extensions v3_req
          openssl pkcs12 -export -nodes -in ScreamCertificate.cer -inkey ScreamCertificate.pvk -out ScreamCertificate.pfx -passout pass:
      - name: Setup MSVC Dev Cmd
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Sign and Install Scream Driver on Windows
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          signtool sign /v /fd SHA256 /f ScreamCertificate.pfx Scream\Install\driver\x64\Scream.cat
          Import-Certificate -FilePath ScreamCertificate.cer -CertStoreLocation Cert:\LocalMachine\root
          Import-Certificate -FilePath ScreamCertificate.cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher
          Scream\Install\helpers\devcon-x64.exe install Scream\Install\driver\x64\Scream.inf *Scream
        timeout-minutes: 5

      - name: Start Windows Audio Service
        if: matrix.os == 'windows-latest'
        run: net start audiosrv
        shell: powershell
        continue-on-error: true
      - name: Install ffmpeg on Windows
        if: matrix.os == 'windows-latest'
        run: choco install ffmpeg -y --no-progress
        shell: powershell

      - name: Setup Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - name: Add JulGame.jl Dependency
        working-directory: ./Battler
        run: julia -e 'using Pkg; Pkg.activate("."); Pkg.add(PackageSpec(url="https://github.com/Kyjor/JulGame.jl", rev="${{ inputs.julgame_rev }}"))'
      - name: Build Julia Package
        working-directory: ./Battler
        run: julia -e 'using Pkg; Pkg.activate("."); Pkg.build()'
      - name: Add swap on Ubuntu (sysimage build can exceed RAM)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo swapoff -a
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - name: Install JuliaC
        run: julia -e 'using Pkg; Pkg.add("JuliaC")'
      - name: Prepare release asset bundle
        run: npm --prefix Battler run prepare:release-bundle
      - name: Build with JuliaC
        shell: bash
        env:
          PackageCompiling: "true"
          SKIP_PRECOMPILE: "false"
          NECRO_DEMO: ${{ inputs.demo }}
          JULIA_IMAGE_THREADS: 4
        run: |
          set -euo pipefail
          # Spreadsheet sync is dev only. HTTP cannot be compiled by juliac --trim.
          if [ "${{ inputs.trim }}" = "true" ]; then
            export ALWAYS_PRECOMPILE=false
            julia --project=Battler -e 'using Pkg; Pkg.rm(["GameDataManager", "XLSX", "JSON", "HTTP"]); Pkg.instantiate()'
            # Linux JLL __init__ does joinpath(dir, parts...), and that splat is not trimmable.
            if [ "$(uname -s)" = "Linux" ]; then
              python3 - <<'PY'
          import os, re, stat
          root = os.path.expanduser("~/.julia/packages")
          assign = re.compile(r"global (\w+) = normpath\(joinpath\(artifact_dir, (\w+)\.\.\.\)\)")
          const_re = re.compile(r"const (\w+) = \[([^\]]*)\]")
          nfiles = 0
          for dirpath, _, files in os.walk(root):
              for fn in files:
                  if not fn.endswith("-linux-gnu.jl"):
                      continue
                  path = os.path.join(dirpath, fn)
                  text = open(path, encoding="utf-8").read()
                  if "splitpath..." not in text:
                      continue
                  counts = {}
                  for m in const_re.finditer(text):
                      counts[m.group(1)] = len(re.findall(r'"[^"]*"', m.group(2)))
                  text, nart = re.subn(
                      r'global artifact_dir = (abspath\(artifact"[^"]+"\))',
                      r'_trim_artifact_dir = \1\n    global artifact_dir = _trim_artifact_dir',
                      text,
                  )
                  if nart == 0:
                      print("no artifact_dir local", path)
                      continue
                  names = []
                  def repl(m, names=names, counts=counts):
                      name, parts = m.group(1), m.group(2)
                      n = counts.get(parts, 0)
                      if n < 1:
                          return m.group(0)
                      expr = "_trim_artifact_dir"
                      for i in range(1, n + 1):
                          expr = f"joinpath({expr}, {parts}[{i}])"
                      names.append(name)
                      return f"_trim_{name} = normpath({expr})\n    global {name} = _trim_{name}"
                  new = assign.sub(repl, text)
                  for name in names:
                      new = new.replace(f"dlopen({name})", f"dlopen(_trim_{name})")
                      new = new.replace(f"dirname({name})", f"dirname(_trim_{name})")
                  if new == text:
                      continue
                  os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
                  open(path, "w", encoding="utf-8").write(new)
                  nfiles += 1
                  print("patched", path)
          print("jll trim patches", nfiles)
          PY
            fi
            set -- --output-exe battler_jc --project Battler --bundle Build --experimental --trim=safe --jl-option threads=4 --verbose Battler/src/juliac_entry.jl
          else
            julia --project=Battler -e 'using Pkg; Pkg.rm(["GameDataManager", "XLSX", "JSON"]); Pkg.instantiate()'
            set -- --output-exe battler_jc --project Battler --bundle Build --experimental --jl-option threads=4 --verbose Battler/src/juliac_entry.jl
          fi
          rm -rf Build
          julia -e 'using JuliaC; JuliaC.main(ARGS)' -- "$@"
          # Linked under another name: `Battler` is already the project directory in the repo root.
          if [ -f Build/bin/battler_jc.exe ]; then mv Build/bin/battler_jc.exe Build/bin/Battler.exe; else mv Build/bin/battler_jc Build/bin/Battler; fi
          ls Build/bin
      - name: Copy Config File to Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cp ./Battler/config.julgame ./Build
      - name: Copy Config File to Build (Mac)
        if: matrix.os == 'macOS-latest'
        run: cp ./Battler/config.julgame ./Build
      - name: Copy Config File to Build (Windows)
        if: matrix.os == 'windows-latest'
        run: copy Battler\config.julgame Build\config.julgame
      - name: Copy libsteam_api.so to Build/bin (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cp ./Battler/libsteam_api.so ./Build/bin/
      - name: Copy steam_appid.txt to Build/bin (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cp ./Battler/src/steam_appid.txt ./Build/bin/
      - name: Copy libsteam_api.dylib to Build/bin (Mac)
        if: matrix.os == 'macOS-latest'
        run: cp ./Battler/libsteam_api.dylib ./Build/bin/
      - name: Copy steam_appid.txt to Build/bin (Mac)
        if: matrix.os == 'macOS-latest'
        run: cp ./Battler/src/steam_appid.txt ./Build/bin/
      - name: Copy steam_api64.dll to Build/bin (Windows)
        if: matrix.os == 'windows-latest'
        run: copy Battler\steam_api64.dll Build\bin\steam_api64.dll
      - name: Copy steam_appid.txt to Build/bin (Windows)
        if: matrix.os == 'windows-latest'
        run: copy Battler\src\steam_appid.txt Build\bin\steam_appid.txt
      - name: Use demo steam_appid.txt
        if: inputs.demo
        shell: bash
        run: printf '4623610' > ./Build/bin/steam_appid.txt
      - name: Import Developer ID certificate (Mac)
        if: matrix.os == 'macOS-latest'
        shell: bash
        run: |
          echo "$MACOS_CERT_P12_B64" | base64 --decode > dev_id.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import dev_id.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm -f dev_id.p12
        env:
          MACOS_CERT_P12_B64: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Codesign and notarize (Mac)
        if: matrix.os == 'macOS-latest'
        shell: bash
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          ./codesign_build.sh
          if [ ! -d Battler.app ]; then
            echo "codesign_build.sh did not create Battler.app"
            exit 1
          fi
          /usr/bin/ditto -c -k --keepParent Battler.app Battler.app.zip
          xcrun notarytool store-credentials battler-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARY_APP_PASSWORD"
          xcrun notarytool submit Battler.app.zip --keychain-profile battler-notary --wait
          xcrun stapler staple Battler.app
          /usr/bin/ditto -c -k --keepParent Battler.app Battler.app.zip

      - name: Encrypt artifact (Linux)
        if: matrix.os == 'ubuntu-latest' && (github.ref_name == 'main' || (inputs.trim && github.ref_name == 'trim'))
        shell: bash
        env:
          ARTIFACT_ENCRYPTION_KEY: ${{ secrets.ARTIFACT_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ENCRYPTION_KEY"
          mkdir -p EncryptedArtifact
          tar -C Build -czf - . | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -out EncryptedArtifact/payload.enc -pass env:ARTIFACT_ENCRYPTION_KEY
      - name: Upload Artifact (Linux)
        if: matrix.os == 'ubuntu-latest' && (github.ref_name == 'main' || (inputs.trim && github.ref_name == 'trim'))
        uses: actions/upload-artifact@v4
        with:
            name: ${{ env.ARTIFACT_PREFIX }}-Linux
            path: EncryptedArtifact/payload.enc
            retention-days: 1
            compression-level: 0
      - name: Package Mac artifact
        if: matrix.os == 'macOS-latest' && (github.ref_name == 'main' || (inputs.trim && github.ref_name == 'trim'))
        run: |
          mkdir -p MacArtifact
          # ditto zip keeps Julia dylib symlinks. upload-artifact of the .app
          # folder follows them and ships two copies of libjulia-internal.
          cp -f Battler.app.zip MacArtifact/Battler.app.zip
      - name: Encrypt artifact (Mac)
        if: matrix.os == 'macOS-latest' && (github.ref_name == 'main' || (inputs.trim && github.ref_name == 'trim'))
        shell: bash
        env:
          ARTIFACT_ENCRYPTION_KEY: ${{ secrets.ARTIFACT_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ENCRYPTION_KEY"
          # macos-latest openssl is LibreSSL, which does not support -pbkdf2.
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          mkdir -p EncryptedArtifact
          tar -C MacArtifact -czf - . | "$OPENSSL" enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -out EncryptedArtifact/payload.enc -pass env:ARTIFACT_ENCRYPTION_KEY
      - name: Upload Artifact (Mac)
        if: matrix.os == 'macOS-latest' && (github.ref_name == 'main' || (inputs.trim && github.ref_name == 'trim'))
        uses: actions/upload-artifact@v4
        with:
            name: ${{ env.ARTIFACT_PREFIX }}-Mac
            path: EncryptedArtifact/payload.enc
            retention-days: 1
            compression-level: 0
      - name: Encrypt artifact (Windows)
        if: matrix.os == 'windows-latest' && (github.ref_name == 'main' || (inputs.trim && github.ref_name == 'trim'))
        shell: bash
        env:
          ARTIFACT_ENCRYPTION_KEY: ${{ secrets.ARTIFACT_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ENCRYPTION_KEY"
          mkdir -p EncryptedArtifact
          tar -C Build -czf - . | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -out EncryptedArtifact/payload.enc -pass env:ARTIFACT_ENCRYPTION_KEY
      - name: Upload Artifact (Windows)
        if: matrix.os == 'windows-latest' && (github.ref_name == 'main' || (inputs.trim && github.ref_name == 'trim'))
        uses: actions/upload-artifact@v4
        with:
            name: ${{ env.ARTIFACT_PREFIX }}-Windows
            path: EncryptedArtifact/payload.enc
            retention-days: 1
            compression-level: 0
