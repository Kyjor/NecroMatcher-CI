name: Build NecroMatcher

on:
  workflow_call:
    inputs:
      demo:
        description: Build the demo variant (NECRO_DEMO baked into the app)
        type: boolean
        default: false
      trim:
        description: juliac --trim=safe against the trim branches
        type: boolean
        default: false
      gmtk_ref:
        description: gmtk-2024 branch to build
        type: string
        default: speed-up-sysimage
      julgame_rev:
        description: JulGame.jl branch to build
        type: string
        default: develop

jobs:
  test:
    name: ${{ inputs.demo && 'Demo' || 'Full' }} - Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      ARTIFACT_PREFIX: ${{ inputs.demo && 'NecroMatcher-Demo' || 'NecroMatcher' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.13'
            os: ubuntu-latest
            arch: x64
          - version: '1.13'
            os: macos-latest
            arch: aarch64
          - version: '1.13'
            os: windows-latest
            arch: x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.PRIVATE_SSH_KEY }}
          repository: Kyjor/gmtk-2024
          ref: ${{ inputs.gmtk_ref }}
          fetch-depth: 1
      - name: Mark JulGame as a trim build
        if: inputs.trim
        working-directory: ./Battler
        run: printf '[JulGame]\ntrim = true\n' > LocalPreferences.toml
      - name: Restore release asset bundle
        if: ${{ !inputs.trim }}
        id: bundle-cache
        uses: actions/cache@v4
        with:
          path: Battler/release-bundle
          key: release-bundle-${{ runner.os }}-${{ hashFiles('Battler/assets/**', 'Battler/tools/prepare-release-bundle.mjs', 'Battler/tools/lib/**') }}
      - name: Setup Node
        if: ${{ !inputs.trim && steps.bundle-cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Battler/package-lock.json
      - name: Install Node Dependencies
        if: ${{ !inputs.trim && steps.bundle-cache.outputs.cache-hit != 'true' }}
        working-directory: ./Battler
        run: npm ci
      - name: Install ffmpeg on Ubuntu
        if: ${{ matrix.os == 'ubuntu-latest' && !inputs.trim && steps.bundle-cache.outputs.cache-hit != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Ensure OpenSSL (and ffmpeg if needed) on macOS
        if: matrix.os == 'macOS-latest'
        env:
          NEED_FFMPEG: ${{ !inputs.trim && steps.bundle-cache.outputs.cache-hit != 'true' }}
        run: |
          pkgs=()
          [ -x "$(brew --prefix openssl@3 2>/dev/null)/bin/openssl" ] || pkgs+=(openssl@3)
          if [ "$NEED_FFMPEG" = "true" ] && ! command -v ffmpeg >/dev/null 2>&1; then
            pkgs+=(ffmpeg)
          fi
          if [ "${#pkgs[@]}" -gt 0 ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install "${pkgs[@]}"
          fi
      - name: Setup MSVC Dev Cmd
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install ffmpeg on Windows
        if: ${{ matrix.os == 'windows-latest' && !inputs.trim && steps.bundle-cache.outputs.cache-hit != 'true' }}
        run: choco install ffmpeg -y --no-progress
        shell: powershell

      - name: Setup Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - name: Resolve JulGame commit SHA
        id: julgame-sha
        shell: bash
        run: |
          SHA=$(git ls-remote https://github.com/Kyjor/JulGame.jl.git "${{ inputs.julgame_rev }}" | head -n1 | cut -f1)
          if [ -z "$SHA" ]; then
            SHA="${{ inputs.julgame_rev }}"
          fi
          echo "Resolved JulGame (${{ inputs.julgame_rev }}) -> $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Cache Julia depot and resolved environment
        id: julia-cache
        uses: actions/cache@v4
        with:
          path: ~/.julia
          key: julia-env-v1-${{ runner.os }}-${{ matrix.version }}-${{ inputs.trim }}-${{ hashFiles('Battler/Project.toml', 'Battler/Manifest.toml') }}-${{ steps.julgame-sha.outputs.sha }}
          restore-keys: |
            julia-env-v1-${{ runner.os }}-${{ matrix.version }}-${{ inputs.trim }}-${{ hashFiles('Battler/Project.toml', 'Battler/Manifest.toml') }}-
            julia-env-v1-${{ runner.os }}-${{ matrix.version }}-${{ inputs.trim }}-
      - name: Add swap on Ubuntu (sysimage build can exceed RAM)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo swapoff -a
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - name: Stage raw assets for trim build
        if: inputs.trim
        shell: bash
        run: |
          rm -rf Battler/release-bundle
          mkdir -p Battler/release-bundle
          cp -r Battler/assets Battler/release-bundle/assets
      - name: Prepare release asset bundle
        if: ${{ !inputs.trim && steps.bundle-cache.outputs.cache-hit != 'true' }}
        run: npm --prefix Battler run prepare:release-bundle
      - name: Setup Julia packages and build with JuliaC
        shell: bash
        env:
          PackageCompiling: "true"
          SKIP_PRECOMPILE: "false"
          NECRO_DEMO: ${{ inputs.demo }}
          JULIA_IMAGE_THREADS: 4
          JULIA_NUM_PRECOMPILE_TASKS: 4
        run: |
          set -euo pipefail
          if [ "${{ inputs.trim }}" = "true" ]; then
            export ALWAYS_PRECOMPILE=false
          fi
          if [ "${{ steps.julia-cache.outputs.cache-hit }}" = "true" ] && [ -f "$HOME/.julia/battler-env/Manifest.toml" ]; then
            echo "Restoring cached Battler Project.toml and Manifest.toml"
            cp "$HOME/.julia/battler-env/Project.toml" Battler/Project.toml
            cp "$HOME/.julia/battler-env/Manifest.toml" Battler/Manifest.toml
          else
            # Spreadsheet sync is dev only. HTTP cannot be compiled by juliac --trim.
            # Swap `Add` then `rm`: `Battler/Manifest.toml` is not committed, so `Pkg.rm` before `Pkg.add`
            # throws because there is no manifest yet, leaving `GameDataManager`/`XLSX`/`JSON`/`HTTP` in Project.toml!
            if [ "${{ inputs.trim }}" = "true" ]; then
              JULIA_PKG_PRECOMPILE_AUTO=0 julia -e '
                using Pkg
                Pkg.add("JuliaC")
                Pkg.activate("Battler")
                Pkg.add(PackageSpec(url="https://github.com/Kyjor/JulGame.jl", rev="${{ steps.julgame-sha.outputs.sha }}"))
                Pkg.rm(["GameDataManager", "XLSX", "JSON", "HTTP"])
                Pkg.instantiate()
              '
              # Linux JLL __init__ does joinpath(dir, parts...), and that splat is not trimmable.
              # Patch before precompilation so JLLs are not compiled twice.
              if [ "$(uname -s)" = "Linux" ]; then
                python3 - <<'PY'
          import os, re, stat
          root = os.path.expanduser("~/.julia/packages")
          assign = re.compile(r"global (\w+) = normpath\(joinpath\(artifact_dir, (\w+)\.\.\.\)\)")
          const_re = re.compile(r"const (\w+) = \[([^\]]*)\]")
          nfiles = 0
          for dirpath, _, files in os.walk(root):
              for fn in files:
                  if not fn.endswith("-linux-gnu.jl"):
                      continue
                  path = os.path.join(dirpath, fn)
                  text = open(path, encoding="utf-8").read()
                  if "splitpath..." not in text or "_trim_artifact_dir" in text:
                      continue
                  counts = {}
                  for m in const_re.finditer(text):
                      counts[m.group(1)] = len(re.findall(r'"[^"]*"', m.group(2)))
                  text, nart = re.subn(
                      r'global artifact_dir = (abspath\(artifact"[^"]+"\))',
                      r'_trim_artifact_dir = \1\n    global artifact_dir = _trim_artifact_dir',
                      text,
                  )
                  if nart == 0:
                      print("no artifact_dir local", path)
                      continue
                  names = []
                  def repl(m, names=names, counts=counts):
                      name, parts = m.group(1), m.group(2)
                      n = counts.get(parts, 0)
                      if n < 1:
                          return m.group(0)
                      expr = "_trim_artifact_dir"
                      for i in range(1, n + 1):
                          expr = f"joinpath({expr}, {parts}[{i}])"
                      names.append(name)
                      return f"_trim_{name} = normpath({expr})\n    global {name} = _trim_{name}"
                  new = assign.sub(repl, text)
                  for name in names:
                      new = new.replace(f"dlopen({name})", f"dlopen(_trim_{name})")
                      new = new.replace(f"dirname({name})", f"dirname(_trim_{name})")
                  if new == text:
                      continue
                  os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
                  open(path, "w", encoding="utf-8").write(new)
                  nfiles += 1
                  print("patched", path)
          print("jll trim patches", nfiles)
          PY
              fi
            else
              JULIA_PKG_PRECOMPILE_AUTO=0 julia -e '
                using Pkg
                Pkg.add("JuliaC")
                Pkg.activate("Battler")
                Pkg.add(PackageSpec(url="https://github.com/Kyjor/JulGame.jl", rev="${{ steps.julgame-sha.outputs.sha }}"))
                Pkg.rm(["GameDataManager", "XLSX", "JSON"])
                Pkg.instantiate()
              '
            fi
            mkdir -p "$HOME/.julia/battler-env"
            cp Battler/Project.toml "$HOME/.julia/battler-env/Project.toml"
            cp Battler/Manifest.toml "$HOME/.julia/battler-env/Manifest.toml"
          fi
          # Always recompile Battler itself so NECRO_DEMO and latest Battler assets/code are baked fresh.
          rm -rf "$HOME"/.julia/compiled/*/Battler
          if [ "${{ inputs.trim }}" = "true" ]; then
            set -- --output-exe battler_jc --project Battler --bundle Build --experimental --trim=safe --jl-option threads=4 --verbose Battler/src/juliac_entry.jl
          else
            set -- --output-exe battler_jc --project Battler --bundle Build --experimental --jl-option threads=4 --verbose Battler/src/juliac_entry.jl
          fi
          rm -rf Build
          julia -e 'using JuliaC; JuliaC.main(ARGS)' -- "$@"
          # Linked under another name: `Battler` is already the project directory in the repo root.
          if [ -f Build/bin/battler_jc.exe ]; then mv Build/bin/battler_jc.exe Build/bin/Battler.exe; else mv Build/bin/battler_jc Build/bin/Battler; fi
          ls Build/bin
      - name: Copy config and Steam files to Build
        shell: bash
        run: |
          cp ./Battler/config.julgame ./Build/config.julgame
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cp ./Battler/libsteam_api.so ./Build/bin/
          elif [ "${{ matrix.os }}" = "macOS-latest" ]; then
            cp ./Battler/libsteam_api.dylib ./Build/bin/
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp ./Battler/steam_api64.dll ./Build/bin/
          fi
          if [ "${{ inputs.demo }}" = "true" ]; then
            printf '4623610' > ./Build/bin/steam_appid.txt
          else
            cp ./Battler/src/steam_appid.txt ./Build/bin/
          fi
      - name: Import Developer ID certificate (Mac)
        if: matrix.os == 'macOS-latest'
        shell: bash
        run: |
          echo "$MACOS_CERT_P12_B64" | base64 --decode > dev_id.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import dev_id.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm -f dev_id.p12
        env:
          MACOS_CERT_P12_B64: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Codesign and notarize (Mac)
        if: matrix.os == 'macOS-latest'
        shell: bash
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          ./codesign_build.sh
          if [ ! -d Battler.app ]; then
            echo "codesign_build.sh did not create Battler.app"
            exit 1
          fi
          /usr/bin/ditto -c -k --keepParent Battler.app Battler.app.zip
          xcrun notarytool store-credentials battler-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARY_APP_PASSWORD"
          xcrun notarytool submit Battler.app.zip --keychain-profile battler-notary --wait
          xcrun stapler staple Battler.app
          /usr/bin/ditto -c -k --keepParent Battler.app Battler.app.zip

      - name: Encrypt artifact (Linux)
        if: matrix.os == 'ubuntu-latest' && (github.ref_name == 'main' || (inputs.trim && github.ref_name == 'trim'))
        shell: bash
        env:
          ARTIFACT_ENCRYPTION_KEY: ${{ secrets.ARTIFACT_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ENCRYPTION_KEY"
          mkdir -p EncryptedArtifact
          tar -C Build -czf - . | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -out EncryptedArtifact/payload.enc -pass env:ARTIFACT_ENCRYPTION_KEY
      - name: Upload Artifact (Linux)
        if: matrix.os == 'ubuntu-latest' && (github.ref_name == 'main' || (inputs.trim && github.ref_name == 'trim'))
        uses: actions/upload-artifact@v4
        with:
            name: ${{ env.ARTIFACT_PREFIX }}-Linux
            path: EncryptedArtifact/payload.enc
            retention-days: 1
            compression-level: 0
      - name: Package and encrypt artifact (Mac)
        if: matrix.os == 'macOS-latest' && (github.ref_name == 'main' || (inputs.trim && github.ref_name == 'trim'))
        shell: bash
        env:
          ARTIFACT_ENCRYPTION_KEY: ${{ secrets.ARTIFACT_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ENCRYPTION_KEY"
          mkdir -p MacArtifact EncryptedArtifact
          # ditto zip keeps Julia dylib symlinks. upload-artifact of the .app
          # folder follows them and ships two copies of libjulia-internal.
          mv -f Battler.app.zip MacArtifact/Battler.app.zip
          # macos-latest openssl is LibreSSL, which does not support -pbkdf2.
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          GZIP=-1 tar -C MacArtifact -czf - . | "$OPENSSL" enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -out EncryptedArtifact/payload.enc -pass env:ARTIFACT_ENCRYPTION_KEY
      - name: Upload Artifact (Mac)
        if: matrix.os == 'macOS-latest' && (github.ref_name == 'main' || (inputs.trim && github.ref_name == 'trim'))
        uses: actions/upload-artifact@v4
        with:
            name: ${{ env.ARTIFACT_PREFIX }}-Mac
            path: EncryptedArtifact/payload.enc
            retention-days: 1
            compression-level: 0
      - name: Encrypt artifact (Windows)
        if: matrix.os == 'windows-latest' && (github.ref_name == 'main' || (inputs.trim && github.ref_name == 'trim'))
        shell: bash
        env:
          ARTIFACT_ENCRYPTION_KEY: ${{ secrets.ARTIFACT_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ENCRYPTION_KEY"
          mkdir -p EncryptedArtifact
          tar -C Build -czf - . | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -out EncryptedArtifact/payload.enc -pass env:ARTIFACT_ENCRYPTION_KEY
      - name: Upload Artifact (Windows)
        if: matrix.os == 'windows-latest' && (github.ref_name == 'main' || (inputs.trim && github.ref_name == 'trim'))
        uses: actions/upload-artifact@v4
        with:
            name: ${{ env.ARTIFACT_PREFIX }}-Windows
            path: EncryptedArtifact/payload.enc
            retention-days: 1
            compression-level: 0
