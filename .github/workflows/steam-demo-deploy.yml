name: Steam Demo Deploy

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI workflow run ID that produced NecroMatcher-Linux / NecroMatcher-Windows artifacts'
        required: true
        type: string
      targets:
        description: 'Platforms to deploy to Steam'
        required: true
        type: choice
        options:
          - both
          - linux
          - windows
        default: both

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Artifact
        if: inputs.targets == 'both' || inputs.targets == 'windows'
        uses: actions/download-artifact@v4
        with:
          name: NecroMatcher-Demo-Windows
          path: ./BuildWindows
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux Artifact
        if: inputs.targets == 'both' || inputs.targets == 'linux'
        uses: actions/download-artifact@v4
        with:
          name: NecroMatcher-Demo-Linux
          path: ./BuildLinux
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decrypt artifacts
        env:
          ARTIFACT_ENCRYPTION_KEY: ${{ secrets.ARTIFACT_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ENCRYPTION_KEY"
          found=0
          for dir in BuildWindows BuildLinux; do
            if [ ! -d "$dir" ]; then
              continue
            fi
            found=1
            if [ ! -f "$dir/payload.enc" ]; then
              echo "Missing encrypted payload in $dir" >&2
              exit 1
            fi
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
              -in "$dir/payload.enc" \
              -out "$dir/payload.tar.gz" \
              -pass env:ARTIFACT_ENCRYPTION_KEY
            tar -xzf "$dir/payload.tar.gz" -C "$dir"
            rm -f "$dir/payload.enc" "$dir/payload.tar.gz"
          done
          if [ "$found" -eq 0 ]; then
            echo "No artifacts to decrypt" >&2
            exit 1
          fi

      - name: Deploy Demo to Steam (Windows + Linux)
        if: inputs.targets == 'both'
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 4623610
          buildDescription: Demo
          rootPath: ./
          depot1Path: BuildWindows
          depot3Path: BuildLinux
          releaseBranch: testing

      - name: Deploy Demo to Steam (Windows only)
        if: inputs.targets == 'windows'
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 4623610
          buildDescription: Demo
          rootPath: ./
          depot1Path: BuildWindows
          releaseBranch: testing

      - name: Deploy Demo to Steam (Linux only)
        if: inputs.targets == 'linux'
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 4623610
          buildDescription: Demo
          rootPath: ./
          depot3Path: BuildLinux
          releaseBranch: testing
