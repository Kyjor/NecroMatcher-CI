name: CI

on:
  workflow_dispatch:

  repository_dispatch:
    types: [trigger-ci]
  
jobs:
  build-full:
    name: Full
    uses: ./.github/workflows/build.yml
    with:
      demo: false
    secrets: inherit

  build-demo:
    name: Demo
    uses: ./.github/workflows/build.yml
    with:
      demo: true
    secrets: inherit
