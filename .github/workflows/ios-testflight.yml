name: iOS TestFlight

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-ci]

jobs:
  testflight:
    name: Build iOS and upload to TestFlight
    runs-on: macos-26

    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          repository: Kyjor/gmtk-2024
          ref: main
          ssh-key: ${{ secrets.PRIVATE_SSH_KEY }}
          path: gmtk-2024

      - name: Checkout JulGame
        uses: actions/checkout@v4
        with:
          repository: Kyjor/JulGame.jl
          ref: develop
          path: JulGame.jl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gmtk-2024/Battler/package-lock.json

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.11

      - name: Materialize uiTypes for case-sensitive bundling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          repo = "JulGame.jl"
          listing = subprocess.check_output(
              ["git", "-C", repo, "ls-tree", "-r", "HEAD"],
              text=True,
          )
          blob = None
          for line in listing.splitlines():
              mode, _typ, sha, path = line.split(maxsplit=3)
              if path.lower().endswith("uitypes.ts") and mode == "100644":
                  blob = sha
                  break
          if not blob:
              raise SystemExit("uiTypes.ts blob not found")
          data = subprocess.check_output(["git", "-C", repo, "cat-file", "-p", blob])
          dest_dir = os.path.join(repo, "ts/_generated/src/engine/UI")
          for name in os.listdir(dest_dir):
              if name.lower() == "uitypes.ts":
                  os.remove(os.path.join(dest_dir, name))
          dest = os.path.join(dest_dir, "uiTypes.ts")
          with open(dest, "wb") as f:
              f.write(data)
          print(f"wrote {dest} ({len(data)} bytes)")
          PY

      - name: Install npm dependencies
        working-directory: gmtk-2024/Battler
        run: npm ci

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Build web bundle
        working-directory: gmtk-2024/Battler
        run: npm run build:package

      - name: Sync Capacitor iOS
        working-directory: gmtk-2024/Battler
        run: npx cap sync ios

      - name: Install Apple certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.NECROMATCHER_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          tmp="$(mktemp)"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$tmp"
          plist="$(mktemp).plist"
          security cms -D -i "$tmp" > "$plist"
          uuid="$(plutil -extract UUID raw "$plist")"
          cp "$tmp" "$HOME/Library/MobileDevice/Provisioning Profiles/${uuid}.mobileprovision"
          echo "Installed profile $uuid"
          rm -f "$tmp" "$plist"

      - name: Archive
        working-directory: gmtk-2024/Battler/ios/App
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            "DEVELOPMENT_TEAM=${APPLE_DEVELOPMENT_TEAM}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Necro-Matcher App Store"

      - name: Export IPA
        working-directory: gmtk-2024/Battler/ios/App
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          DIST_ID="$(security find-identity -v -p codesigning | awk -F'"' '/Apple Distribution/{print $2; exit}')"
          if [ -z "$DIST_ID" ]; then
            echo "No Apple Distribution identity"
            security find-identity -v -p codesigning
            exit 1
          fi
          EXPORT_OPTS="$(mktemp).plist"
          export DIST_ID
          python3 - "$EXPORT_OPTS" <<'PY'
          import os, plistlib, sys
          data = {
            "method": "app-store-connect",
            "signingStyle": "manual",
            "teamID": os.environ["APPLE_DEVELOPMENT_TEAM"],
            "signingCertificate": os.environ["DIST_ID"],
            "provisioningProfiles": {
              "com.kyjor.necromatcher": "Necro-Matcher App Store",
            },
          }
          with open(sys.argv[1], "wb") as f:
            plistlib.dump(data, f)
          PY
          mkdir -p build/export
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/App.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$EXPORT_OPTS"

      - name: Place App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"

      - name: Upload to TestFlight
        working-directory: gmtk-2024/Battler/ios/App
        run: |
          set -euo pipefail
          IPA="$(find build/export -name '*.ipa' -print -quit)"
          if [ -z "$IPA" ]; then
            echo "No IPA"
            find build -type f | head -40
            exit 1
          fi
          echo "Uploading $IPA"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
